[project]
name = "triagem"
version = "0.1.0"
description = "Triagem automática de laudos médicos por classificação de texto"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "scikit-learn (>=1.5,<2.0)",
    "pandas (>=2.2,<3.0)",
    "joblib (>=1.4,<2.0)",
    "fastapi (>=0.115,<1.0)",
    "uvicorn[standard] (>=0.32,<1.0)",
    "pydantic-settings (>=2.6,<3.0)",
    "httpx (>=0.27,<1.0)",
]

[tool.poetry]
packages = [{ include = "triagem", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
ruff = "^0.7.4"
pre-commit = "^4.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
